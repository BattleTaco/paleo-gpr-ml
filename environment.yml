# Conda environment for paleo-gpr-ml -- the dedicated research environment for this paper.
#
# Target: macOS / Apple Silicon (arm64). PyTorch runs on CPU/MPS here; the heavy
# CUDA training box uses requirements.txt (a Linux/CUDA freeze) instead.
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
# Activate: conda activate paleo-gpr-ml
#
# gprMax is intentionally NOT listed here -- it needs a C compiler + OpenMP and is
# finicky on Apple Silicon, so it gets installed as a separate documented step
# (see docs/notes/07_environment_setup.md). The c-compiler / llvm-openmp / cython
# packages below are here so that step has what it needs.
name: paleo-gpr-ml
channels:
  - conda-forge
dependencies:
  # --- core scientific stack (conda-forge builds are cleanest on arm64) ---
  - python=3.11
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - scikit-image>=0.22
  - h5py>=3.9
  - pillow>=10.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyyaml>=6.0
  - tqdm>=4.65
  - click>=8.1
  # --- notebooks ---
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - ipywidgets>=8.0
  # --- build toolchain (for gprMax + any Cython extensions later) ---
  - cython>=3.0
  - c-compiler
  - llvm-openmp
  # --- dev tooling (matches pyproject.toml) ---
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.5
  # --- pip-only / wheels we want straight from PyPI ---
  - pip:
      # deep learning (CPU/MPS wheels on mac arm64)
      - torch>=2.2
      - torchvision>=0.17
      - torchmetrics>=1.2
      # detection / classification / augmentation
      - ultralytics>=8.1
      - timm>=0.9
      - albumentations>=1.4
      - opencv-python>=4.8
      - segmentation-models-pytorch>=0.3
      # medical/volumetric imaging (CT segmentation direction)
      - monai>=1.3
      # config + experiment tracking
      - omegaconf>=2.3
      - hydra-core>=1.3
      - tensorboard>=2.15
